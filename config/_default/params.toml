# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy = "default"

favicon = "favicon.ico"

[footer]
since = 2025
customText = ""

[dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Jan 02, 2006 15:04 MST"

[sidebar]
compact = false
emoji = ""
subtitle = "记忆是……蓝色的？粉色的！"
avatar = "citlali-avatar.jpg"

[article]
headingAnchor = false
math = false
toc = true
readingTime = true

[article.list]
# Showing article tags in the list view (e.g. homepage, section pages)
showTags = false

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

# Mermaid diagram configuration
# Diagrams are only loaded when mermaid code blocks are present
# Theme auto-switches based on site light/dark mode
[article.mermaid]
look = "classic"
lightTheme = "default"
darkTheme = "dark"
securityLevel = "strict"
htmlLabels = true
transparentBackground = false

[article.alertIcon]
note = "📝"
tip = "💡"
important = "📌"
warning = "⚠️"
caution = "🚨"

## Widgets
[widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
  { type = "categories", params = { limit = 10 } },
  { type = "tag-cloud", params = { limit = 10 } },
]
page = [{ type = "toc" }]

[opengraph.twitter]
site = ""
card = "summary_large_image"

[colorScheme]
toggle = true
default = "auto"

[imageProcessing]
autoOrient = false

[imageProcessing.external]
timeout = "5s"

[imageProcessing.content]
widths = [800, 1600, 2400]
enabled = true

[imageProcessing.thumbnail]
enabled = true

# GDPR Cookie Consent Configuration
# When enabled, analytics and functional cookies require user consent
[cookies]
enabled = false
showSettings = true

[cookies.categories]
analytics = true
functional = true

